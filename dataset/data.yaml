# YOLO detection dataset: license plates (dataset-matriculas, 433 images)
# Split 70/20/10 with seed 42 by yolo_license_plates.data.split_dataset;
# labels converted from annotations/ (Pascal VOC) by yolo_license_plates.data.voc_to_yolo.
#
# No `path` key: Ultralytics then uses this file's folder as the dataset root,
# so the same file works locally (./dataset) and in Docker (/app/dataset).

train: images/train
val: images/val
test: images/test

names:
  0: licence
